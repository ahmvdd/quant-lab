name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pytest
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q || [ $? -eq 5 ]  # exit code 5 = no tests collected yet

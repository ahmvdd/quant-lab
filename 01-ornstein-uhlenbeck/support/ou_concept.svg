<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
<rect width="900" height="900" fill="#0b0b0b"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker></defs>
<text x="60" y="70" font-size="26" fill="#e8e8e8" text-anchor="start" font-weight="bold">Le concept d'Ornstein-Uhlenbeck</text>
<line x1="60" y1="86" x2="520" y2="86" stroke="#3a3a3a" stroke-width="1"/>
<text x="60" y="140" font-size="18" fill="#e8e8e8" text-anchor="start" font-weight="normal">1. Revenir vers une moyenne.</text>
<text x="60" y="190" font-size="18" fill="#e8e8e8" text-anchor="start" font-weight="normal">2. Formule mathématique :</text>
<text x="150" y="260" font-size="32" fill="#e8e8e8">dX<tspan font-size="19" dy="7">t</tspan></text>
<text x="222" y="260" font-size="32" fill="#e8e8e8" text-anchor="start" font-weight="normal">=</text>
<text x="262" y="260" font-size="32" fill="#e8e8e8" text-anchor="start" font-weight="normal">θ</text>
<text x="284" y="260" font-size="32" fill="#e8e8e8" text-anchor="start" font-weight="normal">(</text>
<text x="306" y="260" font-size="32" fill="#e8e8e8" text-anchor="start" font-weight="normal">μ</text>
<text x="334" y="260" font-size="32" fill="#e8e8e8" text-anchor="start" font-weight="normal">−</text>
<text x="366" y="260" font-size="32" fill="#e8e8e8">X<tspan font-size="19" dy="7">t</tspan></text>
<text x="400" y="260" font-size="32" fill="#e8e8e8" text-anchor="start" font-weight="normal">)</text>
<text x="430" y="260" font-size="32" fill="#e8e8e8" text-anchor="start" font-weight="normal">dt</text>
<text x="490" y="260" font-size="32" fill="#e8e8e8" text-anchor="start" font-weight="normal">+</text>
<text x="532" y="260" font-size="32" fill="#e8e8e8" text-anchor="start" font-weight="normal">σ</text>
<text x="566" y="260" font-size="32" fill="#e8e8e8">dW<tspan font-size="19" dy="7">t</tspan></text>
<path d="M172,272 L120,322" stroke="#8a8a8a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
<text x="120" y="340" font-size="14" fill="#8a8a8a" text-anchor="middle" font-weight="normal">Xₜ : valeur actuelle</text>
<text x="120" y="359" font-size="14" fill="#8a8a8a" text-anchor="middle" font-weight="normal">du système (dXₜ = sa</text>
<text x="120" y="378" font-size="14" fill="#8a8a8a" text-anchor="middle" font-weight="normal">variation)</text>
<path d="M272,272 L270,402" stroke="#8a8a8a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
<text x="270" y="420" font-size="14" fill="#8a8a8a" text-anchor="middle" font-weight="normal">vitesse avec laquelle</text>
<text x="270" y="439" font-size="14" fill="#8a8a8a" text-anchor="middle" font-weight="normal">il revient</text>
<path d="M315,272 L430,322" stroke="#8a8a8a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
<text x="430" y="340" font-size="14" fill="#8a8a8a" text-anchor="middle" font-weight="normal">moyenne vers</text>
<text x="430" y="359" font-size="14" fill="#8a8a8a" text-anchor="middle" font-weight="normal">laquelle il tend</text>
<path d="M541,272 L600,402" stroke="#8a8a8a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
<text x="600" y="420" font-size="14" fill="#8a8a8a" text-anchor="middle" font-weight="normal">intensité</text>
<text x="600" y="439" font-size="14" fill="#8a8a8a" text-anchor="middle" font-weight="normal">du bruit</text>
<path d="M600,272 L780,322" stroke="#8a8a8a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
<text x="780" y="340" font-size="14" fill="#8a8a8a" text-anchor="middle" font-weight="normal">petit choc aléatoire</text>
<text x="780" y="359" font-size="14" fill="#8a8a8a" text-anchor="middle" font-weight="normal">(mouvement brownien)</text>
<text x="60" y="530" font-size="18" fill="#e8e8e8" text-anchor="start" font-weight="normal">3. Si θ &gt; 0 :</text>
<text x="90" y="575" font-size="17" fill="#e8e8e8" text-anchor="start" font-weight="normal">si Xₜ &lt; μ  →  μ − Xₜ &gt; 0</text>
<text x="120" y="600" font-size="14" fill="#8a8a8a" text-anchor="start" font-weight="normal">le terme est positif et pousse Xₜ vers le haut ↑</text>
<text x="90" y="640" font-size="17" fill="#e8e8e8" text-anchor="start" font-weight="normal">si Xₜ &gt; μ  →  μ − Xₜ &lt; 0</text>
<text x="120" y="665" font-size="14" fill="#8a8a8a" text-anchor="start" font-weight="normal">le terme est négatif et pousse Xₜ vers le bas ↓</text>
<rect x="60" y="710" width="780" height="150" fill="none" stroke="#3a3a3a"/>
<line x1="60" y1="785.0" x2="840" y2="785.0" stroke="#8a8a8a" stroke-dasharray="4 4"/>
<text x="832" y="779.0" font-size="14" fill="#8a8a8a" text-anchor="end" font-weight="normal">μ</text>
